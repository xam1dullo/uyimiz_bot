# ─── Production Docker Compose ───
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uyimiz-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-uyimiz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uyimiz-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?required}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: uyimiz-api-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-uyimiz_app}:${POSTGRES_PASSWORD:-uyimiz_app_prod_pwd}@postgres:5432/${POSTGRES_DB:-uyimiz}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?required}
      BOT_TOKEN: ${BOT_TOKEN:?required}
      BOT_WEBHOOK_DOMAIN: ${BOT_WEBHOOK_DOMAIN:-}
      MINIAPP_URL: ${MINIAPP_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: uyimiz-caddy-prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
